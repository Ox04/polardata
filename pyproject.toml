[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-memory"
version = "0.1.0"
description = "NSIDC sea-ice-age preprocessing for the Polar Memory data-art project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "netCDF4>=1.7",
  "numpy>=2.0",
  "Pillow>=11.0",
  "PyYAML>=6.0",
  "requests>=2.32",
  "tqdm>=4.67",
  "xarray>=2024.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
polar-memory = "polar_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

